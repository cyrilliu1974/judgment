name: 判決書自動抓取 (GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      jid:
        description: '請輸入 JID (格式: 法院代碼,年度,字別,案號,日期,序號)'
        required: true
        default: 'TPHM,113,重上更三,32,20250506,1'

# --- 新增這段權限設定 ---
permissions:
  contents: write
# -----------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 檢出程式碼
      uses: actions/checkout@v3

    - name: 2. 設定 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安裝必要套件
      run: pip install requests urllib3 streamlit

    - name: 4. 執行抓取任務
      env:
        JUDICIALUSER: ${{ secrets.JUDICIALUSER }}
        JUDICIALPWD: ${{ secrets.JUDICIALPWD }}
      run: python app_law.py --jid "${{ github.event.inputs.jid }}"

    - name: 5. 自動將結果存回 GitHub 儲存庫
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        mkdir -p output
        git add output/
        git commit -m "自動更新判決資料: ${{ github.event.inputs.jid }}" || exit 0
        git push